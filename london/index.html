<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsenal FC – Premier League Victory Parade 2026</title>
  <link rel="stylesheet" href="../lib/leaflet.css">
  <style>
    :root {
      --red:    #EF0107;
      --red-dk: #c00005;
      --navy:   #003764;
      --gold:   #9C824A;
      --white:  #FFFFFF;
      --bg:     #f5f5f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--red);
      color: var(--white);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 1000;
    }

    header .crest {
      font-size: 26px;
      flex-shrink: 0;
    }

    header .title-block {
      flex: 1;
      min-width: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header p {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 1px;
    }

    header .badge {
      background: var(--gold);
      color: var(--white);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    #map {
      flex: 1;
      z-index: 1;
    }

    .info-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
      padding: 14px 18px;
      min-width: 260px;
      max-width: calc(100vw - 32px);
      pointer-events: none;
    }

    .info-panel h2 {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 10px;
    }

    .stop-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stop-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #333;
    }

    .stop-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .stop-dot.start  { background: var(--red); }
    .stop-dot.mid    { background: var(--navy); }
    .stop-dot.finish { background: var(--gold); }

    .legend-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #333;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .legend-route {
      width: 28px;
      height: 4px;
      background: var(--red);
      border-radius: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="crest">⚽</div>
  <div class="title-block">
    <h1>Arsenal FC – Victory Parade 2026</h1>
    <p>Premier League Champions 2025/26 · 31 May 2026</p>
  </div>
  <div class="badge">🏆 Champions</div>
</header>

<div id="map"></div>

<div class="info-panel">
  <h2>Parade Route – North London</h2>
  <ul class="stop-list">
    <li><span class="stop-dot start"></span><strong>Emirates Stadium</strong> – Ashburton Grove N7</li>
    <li><span class="stop-dot mid"></span>Holloway Road</li>
    <li><span class="stop-dot mid"></span>Highbury Corner</li>
    <li><span class="stop-dot mid"></span>Upper Street, Islington</li>
    <li><span class="stop-dot finish"></span><strong>Angel</strong> – Islington Town Hall</li>
  </ul>
  <div class="legend-line">
    <div class="legend-route"></div>
    <span>Parade route (~3.2 km)</span>
  </div>
</div>

<script src="../lib/leaflet.js"></script>
<script>
  var map = L.map('map', { zoomControl: true }).setView([51.543, -0.107], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  // ── Parade route coordinates ──────────────────────────────────────────────
  var route = [
    [51.5549, -0.1084],   // Emirates Stadium
    [51.5535, -0.1073],   // Drayton Park / Queensland Rd
    [51.5520, -0.1058],   // Queensland Road heading south
    [51.5507, -0.1043],   // Highbury Corner roundabout
    [51.5484, -0.1040],   // Upper Street (north)
    [51.5460, -0.1038],   // Upper Street
    [51.5440, -0.1037],   // Upper Street – past Canonbury Rd
    [51.5415, -0.1037],   // Upper Street – Essex Road junction
    [51.5390, -0.1038],   // Upper Street (south section)
    [51.5363, -0.1044],   // Approaching Angel
    [51.5335, -0.1053],   // Angel / Islington Town Hall
  ];

  // Red parade route line
  L.polyline(route, {
    color: '#EF0107',
    weight: 6,
    opacity: 0.85,
    lineJoin: 'round',
    lineCap: 'round'
  }).addTo(map);

  // Animated direction arrows (dashed offset line)
  L.polyline(route, {
    color: '#FFFFFF',
    weight: 2,
    opacity: 0.6,
    dashArray: '8 14',
    lineCap: 'butt'
  }).addTo(map);

  // ── Custom marker factory ─────────────────────────────────────────────────
  function makeIcon(emoji, bg) {
    return L.divIcon({
      className: '',
      html: [
        '<div style="',
          'background:', bg, ';',
          'color:#fff;',
          'border:2px solid #fff;',
          'border-radius:50%;',
          'width:36px; height:36px;',
          'display:flex; align-items:center; justify-content:center;',
          'font-size:18px;',
          'box-shadow:0 2px 8px rgba(0,0,0,0.3);',
        '">',
        emoji,
        '</div>'
      ].join(''),
      iconSize: [36, 36],
      iconAnchor: [18, 18],
      popupAnchor: [0, -20]
    });
  }

  // ── Waypoint markers ──────────────────────────────────────────────────────
  var stops = [
    {
      latlng: [51.5549, -0.1084],
      emoji: '🏟️',
      bg: '#EF0107',
      title: 'Emirates Stadium',
      body: 'Parade start · Arsenal\'s home since 2006.<br>Capacity 60,704.'
    },
    {
      latlng: [51.5507, -0.1043],
      emoji: '🔴',
      bg: '#003764',
      title: 'Highbury Corner',
      body: 'Historic junction near the old Highbury ground<br>where Arsenal played 1913–2006.'
    },
    {
      latlng: [51.5440, -0.1037],
      emoji: '🎉',
      bg: '#003764',
      title: 'Upper Street, Islington',
      body: 'The heart of Arsenal country.<br>Thousands of fans line the route.'
    },
    {
      latlng: [51.5335, -0.1053],
      emoji: '🏆',
      bg: '#9C824A',
      title: 'Angel – Islington Town Hall',
      body: 'Parade finish line.<br>Trophy presentation & civic celebration.'
    }
  ];

  stops.forEach(function(s) {
    L.marker(s.latlng, { icon: makeIcon(s.emoji, s.bg) })
      .addTo(map)
      .bindPopup(
        '<strong style="color:#EF0107">' + s.title + '</strong>' +
        '<br><span style="font-size:12px">' + s.body + '</span>',
        { maxWidth: 220 }
      );
  });

  // Open Emirates popup on load
  L.marker(stops[0].latlng, { icon: makeIcon(stops[0].emoji, stops[0].bg) })
    .addTo(map)
    .bindPopup(
      '<strong style="color:#EF0107">' + stops[0].title + '</strong>' +
      '<br><span style="font-size:12px">' + stops[0].body + '</span>',
      { maxWidth: 220 }
    )
    .openPopup();
</script>

</body>
</html>
